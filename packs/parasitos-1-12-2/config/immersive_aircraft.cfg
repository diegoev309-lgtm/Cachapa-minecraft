# Configuration file

general {
    # Accept vanilla furnace fuels in boilers
    B:"Accept vanilla fuel"=true

    # Animate the sails of airships
    B:"Animated sails"=true

    # Burn fuel even when the pilot is in creative mode
    B:"Burn fuel in creative"=false

    # Aircraft take damage when colliding with blocks
    B:"Collision damage"=true

    # Damage multiplier applied to the pilot when an aircraft crashes
    # Min: 0.0
    # Max: 1.7976931348623157E308
    D:"Crash damage"=2.0

    # Use the custom keybind system (multi-key bindings) instead of vanilla movement keys
    B:"Custom keybind system"=true

    # Render trails behind propellers and wings
    B:"Enable trails"=true

    # Global fuel consumption multiplier
    # Min: 0.0
    # Max: 1.7976931348623157E308
    D:"Fuel consumption"=1.0

    # Only players can destroy aircraft (empty aircraft are invulnerable)
    B:"Only players destroy aircraft"=true

    # Crash damage never kills the pilot (leaves half a heart)
    B:"Prevent kill through crash"=true

    # Maximum distance in blocks at which aircraft are rendered
    # Min: 0.0
    # Max: 1.7976931348623157E308
    D:"Render distance"=192.0

    # Use a custom, non-vanilla camera behavior while flying
    B:"Separate camera"=true

    # Switch to third person when entering an aircraft
    B:"Third person by default"=true

    # Wind strength in clear weather
    # Min: 0.0
    # Max: 1.7976931348623157E308
    D:"Wind (clear)"=1.0

    # Wind strength in rain
    # Min: 0.0
    # Max: 1.7976931348623157E308
    D:"Wind (rain)"=3.0

    # Wind strength in thunderstorms
    # Min: 0.0
    # Max: 1.7976931348623157E308
    D:"Wind (thunder)"=3.0

    fuel {
        # Additional fuels, one per line, in the form modid:itemid=burnTimeInTicks (e.g. minecraft:lava_bucket=20000)
        S:"Fuel list" <
         >
    }

}


