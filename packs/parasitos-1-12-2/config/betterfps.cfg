# Configuration file

general {
    # The algorithm to use for sine and cosine calculations.
    # Valid values: "vanilla", "rivens", "rivens-full", "rivens-half", "java", "random", "taylor", "libgdx"
    S:algorithm=rivens-half

    # If true, BetterFps will clear the memory during chunk generation.
    B:fastBox=true

    # If true, BetterFps will optimize the beacon code.
    B:fastBeacon=true

    # If true, BetterFps will optimize the hopper code.
    B:fastHopper=true
}
